name: Quantum Fidelity Kernel Tests

on:
  push:
    branches:
      - main
      - qdf_qkn_approach
  pull_request:
    branches:
      - main
      - qdf_qkn_approach
  workflow_dispatch:

jobs:
  qkn-kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 pennylane==0.42.3 scikit-learn==1.7.2 pytest
      - name: Run quantum fidelity kernel tests
        run: python -m pytest -q tests/test_qkn_kernel.py
